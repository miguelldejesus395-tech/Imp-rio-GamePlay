<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Império GamePlay</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(37,99,235,.25), transparent 35%),
        linear-gradient(135deg, #07111f, #111b32, #080d18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(15, 23, 42, .94);
      border: 1px solid rgba(59,130,246,.45);
      border-radius: 22px;
      padding: 35px 30px;
      box-shadow:
        0 0 50px rgba(37,99,235,.18),
        inset 0 0 30px rgba(59,130,246,.03);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .form-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .campo {
      margin-bottom: 12px;
    }

    .campo label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59,130,246,.18);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn-principal {
      background: linear-gradient(90deg, #3b82f6, #2563eb);
    }

    .btn-cadastro {
      background: linear-gradient(90deg, #7c3aed, #db2777);
    }

    .btn-voltar {
      background: #263449;
    }

    .troca {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .troca button {
      background: transparent;
      color: #60a5fa;
      padding: 5px;
      margin-top: 5px;
      width: auto;
    }

    .erro,
    .sucesso {
      display: none;
      text-align: center;
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
    }

    .erro {
      color: #fecaca;
      background: rgba(220,38,38,.12);
      border: 1px solid rgba(239,68,68,.25);
    }

    .sucesso {
      color: #bbf7d0;
      background: rgba(22,163,74,.12);
      border: 1px solid rgba(34,197,94,.25);
    }

    .escondido {
      display: none;
    }

    .marca {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <!-- LOGIN -->
    <div id="loginArea">

      <h1>👑 Império GamePlay</h1>

      <p class="subtitle">
        Jogos na Nuvem — Sua diversão, onde estiver
      </p>

      <div class="form-title">Entrar na sua conta</div>

      <div class="campo">
        <label>Usuário</label>
        <input
          type="text"
          id="usuarioLogin"
          placeholder="Digite seu usuário"
          autocomplete="username"
        >
      </div>

      <div class="campo">
        <label>Senha</label>
        <input
          type="password"
          id="senhaLogin"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        >
      </div>

      <button class="btn-principal" onclick="entrar()">
        Entrar
      </button>

      <div id="erroLogin" class="erro"></div>

      <div class="troca">
        Ainda não possui uma conta?
        <br>
        <button onclick="mostrarCadastro()">
          Criar minha conta
        </button>
      </div>

    </div>


    <!-- CADASTRO -->
    <div id="cadastroArea" class="escondido">

      <h1>👑 Império GamePlay</h1>

      <p class="subtitle">
        Crie sua conta e comece a jogar na nuvem.
      </p>

      <div class="form-title">Criar conta</div>

      <div class="campo">
        <label>Usuário</label>
        <input
          type="text"
          id="usuarioCadastro"
          placeholder="Escolha seu usuário"
          autocomplete="username"
        >
      </div>

      <div class="campo">
        <label>E-mail</label>
        <input
          type="email"
          id="emailCadastro"
          placeholder="seuemail@gmail.com"
          autocomplete="email"
        >
      </div>

      <div class="campo">
        <label>Senha</label>
        <input
          type="password"
          id="senhaCadastro"
          placeholder="Crie uma senha"
          autocomplete="new-password"
        >
      </div>

      <div class="campo">
        <label>Confirmar senha</label>
        <input
          type="password"
          id="confirmarSenhaCadastro"
          placeholder="Digite a senha novamente"
          autocomplete="new-password"
        >
      </div>

      <button class="btn-cadastro" onclick="cadastrar()">
        Criar conta
      </button>

      <div id="erroCadastro" class="erro"></div>

      <div id="sucessoCadastro" class="sucesso"></div>

      <div class="troca">
        Já possui uma conta?
        <br>
        <button onclick="mostrarLogin()">
          Voltar para entrar
        </button>
      </div>

    </div>

    <div class="marca">
      Império GamePlay © 2026
    </div>

  </div>


<script>

  function mostrarCadastro() {
    document.getElementById('loginArea').classList.add('escondido');
    document.getElementById('cadastroArea').classList.remove('escondido');

    limparMensagens();
  }


  function mostrarLogin() {
    document.getElementById('cadastroArea').classList.add('escondido');
    document.getElementById('loginArea').classList.remove('escondido');

    limparMensagens();
  }


  function limparMensagens() {
    document.getElementById('erroLogin').style.display = 'none';
    document.getElementById('erroCadastro').style.display = 'none';
    document.getElementById('sucessoCadastro').style.display = 'none';
  }


  async function entrar() {

    const user =
      document.getElementById('usuarioLogin').value.trim();

    const pass =
      document.getElementById('senhaLogin').value;

    const erro =
      document.getElementById('erroLogin');

    erro.style.display = 'none';

    if (!user || !pass) {
      erro.textContent = 'Digite usuário e senha.';
      erro.style.display = 'block';
      return;
    }

    try {

      const resposta = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          user: user,
          pass: pass
        })
      });

      const dados = await resposta.json();

      if (!dados.ok) {
        erro.textContent =
          dados.error || 'Usuário ou senha incorretos.';
        erro.style.display = 'block';
        return;
      }

      localStorage.setItem('igc_token', dados.token);
      localStorage.setItem('igc_role', dados.role);

      if (dados.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'usuario.html';
      }

    } catch (e) {

      erro.textContent =
        'Não foi possível conectar ao servidor.';

      erro.style.display = 'block';
    }
  }


  async function cadastrar() {

    const username =
      document.getElementById('usuarioCadastro').value.trim();

    const email =
      document.getElementById('emailCadastro').value.trim();

    const password =
      document.getElementById('senhaCadastro').value;

    const confirmar =
      document.getElementById('confirmarSenhaCadastro').value;

    const erro =
      document.getElementById('erroCadastro');

    const sucesso =
      document.getElementById('sucessoCadastro');

    erro.style.display = 'none';
    sucesso.style.display = 'none';

    if (!username || !email || !password || !confirmar) {
      erro.textContent =
        'Preencha todos os campos.';
      erro.style.display = 'block';
      return;
    }

    if (password.length < 6) {
      erro.textContent =
        'A senha precisa ter pelo menos 6 caracteres.';
      erro.style.display = 'block';
      return;
    }

    if (password !== confirmar) {
      erro.textContent =
        'As senhas não são iguais.';
      erro.style.display = 'block';
      return;
    }

    try {

      const resposta = await fetch('/api/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username: username,
          email: email,
          password: password
        })
      });

      const dados = await resposta.json();

      if (!dados.ok) {
        erro.textContent =
          dados.error || 'Não foi possível criar a conta.';
        erro.style.display = 'block';
        return;
      }

      sucesso.textContent =
        'Conta criada com sucesso! Agora faça login.';

      sucesso.style.display = 'block';

      document.getElementById('usuarioCadastro').value = '';
      document.getElementById('emailCadastro').value = '';
      document.getElementById('senhaCadastro').value = '';
      document.getElementById('confirmarSenhaCadastro').value = '';

      setTimeout(() => {
        mostrarLogin();
      }, 1500);

    } catch (e) {

      erro.textContent =
        'Não foi possível conectar ao servidor.';

      erro.style.display = 'block';
    }
  }


  document.addEventListener('keydown', function(event) {

    if (event.key !== 'Enter') return;

    if (!document.getElementById('loginArea')
      .classList.contains('escondido')) {

      entrar();

    } else {

      cadastrar();

    }

  });

</script>

</body>
</html>
