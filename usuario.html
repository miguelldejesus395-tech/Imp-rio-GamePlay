<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Império GamePlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a2f4d 0, #050a14 50%);
      color: #e6f0ff;
    }
    header {
      background: rgba(10, 20, 40, 0.8);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(59, 130, 246, 0.25);
    }
    .logo { font-size: 22px; font-weight: bold; color: #60a5fa; }
    .user-info { display: flex; gap: 15px; align-items: center; }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: none;
      background: #2563eb; color: white; cursor: pointer;
    }
    .btn-sair { background: #dc2626; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
    .card {
      background: rgba(30, 64, 100, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px; padding: 25px;
      transition: 0.3s;
    }
    .card:hover { border-color: #3b82f6; transform: translateY(-3px); }
    .card h3 { margin-bottom: 12px; color: #93c5fd; }
    .status { color: #4ade80; font-weight: bold; }
    .menu-lateral {
      display: flex; flex-direction: column; gap: 10px; margin-top: 20px;
    }
    .menu-lateral a {
      color: #cbd5e1; text-decoration: none; padding: 12px 15px;
      border-radius: 8px; transition: 0.2s;
    }
    .menu-lateral a:hover, .menu-lateral a.ativo {
      background: rgba(59, 130, 246, 0.2); color: white;
    }
    .conteudo { display: flex; gap: 25px; }
    .col-esq { width: 200px; }
    .col-dir { flex: 1; }
    h2 { margin-bottom: 20px; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">👑 Império GamePlay</div>
    <div class="user-info">
      <span id="nome-usuario">Usuário</span>
      <button class="btn btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="container conteudo">
    <div class="col-esq">
      <div class="menu-lateral">
        <a href="#" class="ativo">🏠 Início</a>
        <a href="#">🖥️ Meus Servidores</a>
        <a href="#">🛒 Comprar</a>
        <a href="#">📋 Pedidos</a>
        <a href="#">👤 Perfil</a>
        <a href="#">⚙️ Configurações</a>
      </div>
    </div>

    <div class="col-dir">
      <h2>Bem-vindo(a)!</h2>
      
      <div class="grid">
        <div class="card">
          <h3>⏱️ Minutos Restantes</h3>
          <p style="font-size: 32px; font-weight: bold; margin-top: 10px;" id="minutos">0</p>
        </div>
        <div class="card">
          <h3>🖥️ Servidores Ativos</h3>
          <p style="font-size: 32px; font-weight: bold; margin-top: 10px;">0</p>
        </div>
        <div class="card">
          <h3>📦 Plano Atual</h3>
          <p style="font-size: 18px; margin-top: 10px;">Nenhum</p>
        </div>
      </div>

      <div class="grid" style="margin-top: 40px;">
        <div class="card">
          <h3>🎮 Acessar Servidor</h3>
          <p style="margin: 10px 0;">IP: <span id="servidor-ip">---</span></p>
          <p>Porta: <span id="servidor-porta">---</span></p>
          <button class="btn" style="margin-top: 15px; width: 100%;">Conectar</button>
        </div>
        <div class="card">
          <h3>💳 Adicionar Créditos</h3>
          <p style="margin: 10px 0;">Compre minutos e jogue!</p>
          <button class="btn" style="margin-top: 15px; width: 100%;">Comprar Agora</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('igc_token');
    if (!token) window.location.href = 'index.html';

    function sair() {
      localStorage.removeItem('igc_token');
      localStorage.removeItem('igc_role');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
